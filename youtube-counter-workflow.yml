# Copy this into a new file at: .github/workflows/youtube.yml
# Requires repo secret YT_API_KEY (YouTube Data API v3 key).
name: Update YouTube stats
on:
  schedule:
    - cron: "0 6 * * *"   # daily ~06:00 UTC
  workflow_dispatch:        # lets you run it manually from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch channel stats
        run: |
          DATA=$(curl -s "https://www.googleapis.com/youtube/v3/channels?part=statistics&forHandle=aidenjchoi&key=${{ secrets.YT_API_KEY }}")
          SUBS=$(echo "$DATA" | python3 -c "import sys,json;print(json.load(sys.stdin)['items'][0]['statistics']['subscriberCount'])")
          VIEWS=$(echo "$DATA" | python3 -c "import sys,json;print(json.load(sys.stdin)['items'][0]['statistics']['viewCount'])")
          VIDS=$(echo "$DATA" | python3 -c "import sys,json;print(json.load(sys.stdin)['items'][0]['statistics']['videoCount'])")
          printf '{\n  "subscribers": %s,\n  "views": %s,\n  "videos": %s,\n  "updated": "%s"\n}\n' "$SUBS" "$VIEWS" "$VIDS" "$(date -u +%Y-%m-%d)" > youtube.json
          cat youtube.json
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add youtube.json
          git commit -m "Update YouTube stats" || echo "no change"
          git push
